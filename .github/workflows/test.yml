name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test -timeout 30s -race -count=1 ./...

      - name: Coverage (overall >= 80%)
        run: make coverage

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o prest-mcp ./cmd/prest-mcp

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          args: --timeout=5m
